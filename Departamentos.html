<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departamentos</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }

    /* CABECERA Y LOGOTIPO */
    header {
      background-color: #1a1a1a;
      padding: 10px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      flex-wrap: wrap;
      gap: 15px;
      min-height: 90px;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo img {
      display: block;
      width: 180px;
      height: 70px;
      object-fit: contain;
      object-position: left center;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #25d366;
    }

    /* CONTENEDOR PRINCIPAL */
    .contenedor-deptos {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    /* GALERÍA CON EFECTO CORTINA */
    .parte-uno {
      height: 100vh;
      min-height: 450px;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .galeria-cortina {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .cortina-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: scaleY(0);
      transform-origin: top;
      transition:
        transform 0.8s ease-in-out,
        opacity 0.8s ease-in-out,
        visibility 0.8s;
      pointer-events: none;
    }

    .cortina-img img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* IMAGEN ACTIVA */
    .cortina-img.activa {
      opacity: 1;
      visibility: visible;
      transform: scaleY(1);
      transform-origin: top;
      z-index: 2;
      pointer-events: auto;
    }

    /* EFECTO DE SALIDA */
    .cortina-img.saliendo {
      opacity: 0;
      visibility: visible;
      transform: scaleY(0);
      transform-origin: bottom;
      z-index: 3;
    }

    /* BOTONES ANTERIOR Y SIGUIENTE */
    .control-galeria {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-size: 26px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.3s;
    }

    .control-galeria:hover {
      background: #25d366;
    }

    .control-anterior {
      left: 20px;
    }

    .control-siguiente {
      right: 20px;
    }

    /* INDICADORES DE LA GALERÍA */
    .indicadores-galeria {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 12px;
    }

    .indicador {
      width: 13px;
      height: 13px;
      border: 2px solid white;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    .indicador.activo {
      background: #25d366;
      border-color: #25d366;
    }

    /* INFORMACIÓN DEL DEPARTAMENTO */
    .parte-dos {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    .seccion-dos-tercios {
      flex: 2;
      background-image: url('Planta 1 ambientada.jpg');
      background-size: cover;
      background-position: center;
      min-height: 400px;
    }

    .seccion-un-tercio {
      flex: 1;
      background: white;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: -5px 0 15px rgba(0, 0, 0, 0.05);
    }

    .seccion-un-tercio h2 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #1a1a1a;
    }

    .metros-cuadrados {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 25px;
      color: #555;
      border-bottom: 2px solid #eee;
      padding-bottom: 15px;
    }

    .lista-caracteristicas {
      list-style: none;
    }

    .item-caracteristica {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .mini-logo {
      width: 32px;
      height: 32px;
      margin-right: 15px;
      background: #f0f0f0;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .mini-logo img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    /* BOTÓN WHATSAPP */
    .btn-whatsapp {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      background-color: #25d366;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 1000;
    }

    .btn-whatsapp img {
      width: 35px;
      height: 35px;
      object-fit: contain;
    }

    /* ADAPTACIÓN A MÓVILES */
    @media (max-width: 900px) {
      header {
        flex-direction: column;
        align-items: center;
        padding: 15px;
      }

      .logo img {
        width: 160px;
        height: 60px;
      }

      nav {
        justify-content: center;
        gap: 12px;
      }

      .parte-uno {
        height: 65vh;
        min-height: 350px;
      }

      .parte-dos {
        flex-direction: column;
      }

      .seccion-dos-tercios {
        min-height: 350px;
      }

      .seccion-un-tercio {
        padding: 25px;
      }
    }

    @media (max-width: 480px) {
      nav {
        gap: 10px;
        font-size: 14px;
      }

      .control-galeria {
        width: 40px;
        height: 40px;
        font-size: 22px;
      }

      .control-anterior {
        left: 10px;
      }

      .control-siguiente {
        right: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cortina-img {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!-- CABECERA CON LOGOTIPO -->
  <header>
    <a href="Index.html" class="logo">
      <img src="logo.jpg" alt="Logotipo del edificio">
    </a>

    <nav>
      <a href="index.html">Inicio</a>
      <a href="Departamentos.html">Departamentos</a>
      <a href="Amenidades.html">Amenidades</a>
      <a href="Contacto.html">Contacto</a>
    </nav>
  </header>

  <main class="contenedor-deptos">

    <!-- GALERÍA DE IMÁGENES -->
    <section class="parte-uno">

      <div class="galeria-cortina" id="galeriaCortina">

        <div class="cortina-img activa">
          <img src="Sala y entrada.jpg"
               alt="Sala y entrada del departamento">
        </div>

        <div class="cortina-img">
          <img src="cocina.jpg"
               alt="Cocina del departamento">
        </div>

        <div class="cortina-img">
          <img src="Cuarto.jpg"
               alt="Recámara del departamento">
        </div>

        <div class="cortina-img">
          <img src="Baño.jpg"
               alt="Baño del departamento">
        </div>

        <div class="cortina-img">
          <img src="escaleras.jpg"
               alt="Escaleras del departamento">
        </div>

        <!-- BOTÓN ANTERIOR -->
        <button
          type="button"
          class="control-galeria control-anterior"
          id="anterior"
          aria-label="Imagen anterior">
          &#10094;
        </button>

        <!-- BOTÓN SIGUIENTE -->
        <button
          type="button"
          class="control-galeria control-siguiente"
          id="siguiente"
          aria-label="Imagen siguiente">
          &#10095;
        </button>

        <!-- INDICADORES -->
        <div
          class="indicadores-galeria"
          id="indicadoresGaleria">
        </div>

      </div>
    </section>

    <!-- INFORMACIÓN DEL DEPARTAMENTO -->
    <section class="parte-dos">

      <div class="seccion-dos-tercios"></div>

      <div class="seccion-un-tercio">

        <h2>Modelo Premium</h2>

        <div class="metros-cuadrados">
          📐 94 m² Totales
        </div>

        <ul class="lista-caracteristicas">

          <li class="item-caracteristica">
            <span class="mini-logo">
              <img src="dormitorio.jpg" alt="">
            </span>
            <span>2 Recámaras</span>
          </li>

          <li class="item-caracteristica">
            <span class="mini-logo">
              <img src="bañol.jpg" alt="">
            </span>
            <span>Baño completo</span>
          </li>

          <li class="item-caracteristica">
            <span class="mini-logo">
              <img src="kitchen.jpg" alt="">
            </span>
            <span>Cocina integral</span>
          </li>

          <li class="item-caracteristica">
            <span class="mini-logo">
              <img src="sala.jpg" alt="">
            </span>
            <span>Sala de estar</span>
          </li>

          <li class="item-caracteristica">
            <span class="mini-logo">
              <img src="comedor.jpg" alt="">
            </span>
            <span>Comedor</span>
          </li>

          <li class="item-caracteristica">
            <span class="mini-logo">
              <img src="balcón.jpg" alt="">
            </span>
            <span>Balcón privado</span>
          </li>

        </ul>
      </div>

    </section>

  </main>

  <!-- BOTÓN WHATSAPP -->
  <a
    href="https://wa.me/5215511324523"
    class="btn-whatsapp"
    target="_blank"
    rel="noopener noreferrer">

    <img src="LogoW.jpg" alt="WhatsApp">

  </a>

  <!-- FUNCIONAMIENTO DE LA GALERÍA -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const galeria = document.getElementById("galeriaCortina");

      const imagenes = Array.from(
        galeria.querySelectorAll(".cortina-img")
      );

      const botonAnterior = document.getElementById("anterior");
      const botonSiguiente = document.getElementById("siguiente");

      const contenedorIndicadores =
        document.getElementById("indicadoresGaleria");

      let indiceActual = 0;
      let temporizador;
      let tiempoAnimacion;

      const intervalo = 5000;

      /* CREAR INDICADORES */
      imagenes.forEach(function (imagen, indice) {

        const indicador = document.createElement("button");

        indicador.type = "button";
        indicador.className = "indicador";

        indicador.setAttribute(
          "aria-label",
          "Mostrar imagen " + (indice + 1)
        );

        indicador.addEventListener("click", function (evento) {
          evento.stopPropagation();
          mostrarImagen(indice);
          reiniciarTemporizador();
        });

        contenedorIndicadores.appendChild(indicador);

      });

      const indicadores = Array.from(
        contenedorIndicadores.querySelectorAll(".indicador")
      );

      /* CAMBIAR IMAGEN */
      function mostrarImagen(nuevoIndice) {

        if (nuevoIndice === indiceActual) {
          return;
        }

        const anterior = imagenes[indiceActual];
        const siguiente = imagenes[nuevoIndice];

        clearTimeout(tiempoAnimacion);

        imagenes.forEach(function (imagen) {
          imagen.classList.remove("activa", "saliendo");
        });

        anterior.classList.add("saliendo");
        siguiente.classList.add("activa");

        indicadores.forEach(function (indicador, indice) {
          indicador.classList.toggle(
            "activo",
            indice === nuevoIndice
          );
        });

        indiceActual = nuevoIndice;

        tiempoAnimacion = setTimeout(function () {
          anterior.classList.remove("saliendo");
        }, 850);

      }

      /* SIGUIENTE IMAGEN */
      function siguienteImagen() {

        const nuevoIndice =
          (indiceActual + 1) % imagenes.length;

        mostrarImagen(nuevoIndice);

      }

      /* IMAGEN ANTERIOR */
      function imagenAnterior() {

        const nuevoIndice =
          (indiceActual - 1 + imagenes.length) % imagenes.length;

        mostrarImagen(nuevoIndice);

      }

      /* TEMPORIZADOR AUTOMÁTICO */
      function reiniciarTemporizador() {

        clearInterval(temporizador);

        temporizador = setInterval(function () {
          siguienteImagen();
        }, intervalo);

      }

      /* BOTONES LATERALES */
      botonSiguiente.addEventListener("click", function (evento) {

        evento.stopPropagation();

        siguienteImagen();
        reiniciarTemporizador();

      });

      botonAnterior.addEventListener("click", function (evento) {

        evento.stopPropagation();

        imagenAnterior();
        reiniciarTemporizador();

      });

      /* HACER CLIC EN LA IMAGEN */
      galeria.addEventListener("click", function (evento) {

        if (
          evento.target.closest(".control-galeria") ||
          evento.target.closest(".indicadores-galeria")
        ) {
          return;
        }

        siguienteImagen();
        reiniciarTemporizador();

      });

      /* NAVEGACIÓN CON TECLADO */
      document.addEventListener("keydown", function (evento) {

        if (evento.key === "ArrowRight") {
          siguienteImagen();
          reiniciarTemporizador();
        }

        if (evento.key === "ArrowLeft") {
          imagenAnterior();
          reiniciarTemporizador();
        }

      });

      /* ACTIVAR PRIMER INDICADOR */
      indicadores[0].classList.add("activo");

      /* INICIAR CAMBIO AUTOMÁTICO */
      reiniciarTemporizador();

    });
  </script>

</body>
</html>
